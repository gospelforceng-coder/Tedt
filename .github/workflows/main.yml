name: RDP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secure-rdp:

    runs-on: windows-latest

    timeout-minutes: 3600

    steps:

      # ============================================================
      # 1. Configure Core RDP Settings
      # ============================================================

      - name: Configure Core RDP Settings
        shell: powershell
        run: |

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service `
            -Name TermService `
            -Force


      # ============================================================
      # 2. Checkout persistence code
      # ============================================================

      - name: Checkout persistence system
        uses: actions/checkout@v4


      # ============================================================
      # 3. Create RDP User
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{
            Upper   = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            Lower   = [char[]]"abcdefghijklmnopqrstuvwxyz"
            Number  = [char[]]"0123456789"
            Special = [char[]]"!@#$%^&*"
          }

          $rawPassword = @()

          $rawPassword += `
            $charSet.Upper |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Lower |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Number |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Special |
            Get-Random -Count 4

          $password =
            -join (
              $rawPassword |
              Sort-Object {
                Get-Random
              }
            )

          $securePass =
            ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $user =
            Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if (!$user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"
          }

          "RDP_CREDS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ============================================================
      # 4. Install Tailscale
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |

          $url =
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $file =
            "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            $url `
            -OutFile $file

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $file `
            -Force


      # ============================================================
      # 5. Connect Tailscale
      # ============================================================

      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          & "$env:ProgramFiles\Tailscale\tailscale.exe" `
            up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=rdp-node

          $ip = $null

          for ($i = 0; $i -lt 10; $i++) {

            $ip =
              & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (!$ip) {
            exit 1
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ============================================================
      # 6. Install rclone
      # ============================================================

      - name: Install rclone
        shell: powershell
        run: |

          Invoke-WebRequest `
            "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile "rclone.zip"

          Expand-Archive `
            "rclone.zip" `
            -DestinationPath $env:TEMP `
            -Force

          Copy-Item `
            "$env:TEMP\rclone*\rclone.exe" `
            "C:\Windows\System32\rclone.exe" `
            -Force


      # ============================================================
      # 7. Send RDP credentials
      # ============================================================

      - name: Send Notification to Telegram
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_PASS: ${{ env.RDP_CREDS }}
          RDP_IP: ${{ env.TAILSCALE_IP }}

        run: |

          $message = @"
          🚀 <b>Universal RDP Ready</b>

          🌐 <b>IP:</b> <code>$env:RDP_IP</code>
          👤 <b>User:</b> <code>RDP</code>
          🔑 <b>Pass:</b> <code>$env:RDP_PASS</code>

          <i>Restoring your previous environment...</i>
          "@

          $url =
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          } |
          ConvertTo-Json

          Invoke-RestMethod `
            -Uri $url `
            -Method Post `
            -ContentType "application/json" `
            -Body $body


      # ============================================================
      # 8. Capture clean runner baseline
      # ============================================================

      - name: Capture fresh Windows baseline
        shell: powershell
        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\capture-baseline.ps1"


      # ============================================================
      # 9. Restore previous RDP state
      # ============================================================

      - name: Restore previous RDP environment
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\restore.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_CREDS"


      # ============================================================
      # 10. RDP session is now ready
      # ============================================================

      - name: Notify Environment Ready
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          $message = @"
          ✅ <b>RDP Environment Restored</b>

          Your previous files, application configurations,
          presets and mapped software have been restored.

          🖥️ <b>IP:</b> <code>${{ env.TAILSCALE_IP }}</code>
          👤 <b>User:</b> <code>RDP</code>
          "@

          $url =
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          } |
          ConvertTo-Json

          Invoke-RestMethod `
            -Uri $url `
            -Method Post `
            -ContentType "application/json" `
            -Body $body


      # ============================================================
      # 11. CHECKPOINT
      #
      # This is deliberately separate from restoration.
      # The next iteration will turn this into the timed transition
      # controller.
      # ============================================================

      - name: Create RDP checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\checkpoint.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_CREDS"


      # ============================================================
      # 12. Final status
      # ============================================================

      - name: Send Final Status
        if: always()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          $status = "${{ job.status }}"

          $message = @"
          🏁 <b>RDP Session Finished</b>

          Status: <b>$status</b>

          Persistent checkpoint has been created
          when the checkpoint stage completed successfully.
          "@

          $url =
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          } |
          ConvertTo-Json

          Invoke-RestMethod `
            -Uri $url `
            -Method Post `
            -ContentType "application/json" `
            -Body $body