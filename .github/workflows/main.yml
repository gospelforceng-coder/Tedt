name: RDP

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: persistent-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    name: Persistent Windows RDP
    runs-on: windows-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. BASIC DIAGNOSTIC
      # ============================================================

      - name: Verify runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " RDP WORKFLOW STARTED"
          Write-Host "=========================================="

          Write-Host "Computer:"
          $env:COMPUTERNAME

          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Workspace:"
          $env:GITHUB_WORKSPACE


      # ============================================================
      # 3. CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |

          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configured."


      # ============================================================
      # 4. CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        shell: powershell
        run: |

          Write-Host "Creating RDP account..."

          $upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijklmnopqrstuvwxyz".ToCharArray()
          $numbers = "0123456789".ToCharArray()
          $special = "!@#$%^&*".ToCharArray()

          $passwordChars = @()

          $passwordChars += $upper |
            Get-Random -Count 4

          $passwordChars += $lower |
            Get-Random -Count 4

          $passwordChars += $numbers |
            Get-Random -Count 4

          $passwordChars += $special |
            Get-Random -Count 4

          $password = -join (
            $passwordChars |
            Sort-Object { Get-Random }
          )

          $securePassword =
            ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $existingUser =
            Get-LocalUser `
              -Name 'RDP' `
              -ErrorAction SilentlyContinue

          if ($existingUser) {

            Set-LocalUser `
              -Name 'RDP' `
              -Password $securePassword

          }
          else {

            New-LocalUser `
              -Name 'RDP' `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires $true

          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          "RDP_CREDS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Write-Host "RDP account ready."


      # ============================================================
      # 5. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |

          $installer =
            Join-Path `
              $env:TEMP `
              'tailscale.msi'

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' `
            -OutFile $installer `
            -UseBasicParsing

          Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # 6. CONNECT TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            '--hostname=rdp-node'

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {

            $ip =
              (& $tailscale ip -4 2>$null |
                Select-Object -First 1).Trim()

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ip) {
            throw "Tailscale did not provide an IPv4 address."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Write-Host "Tailscale IP: $ip"


      # ============================================================
      # 7. INSTALL RCLONE
      # ============================================================

      - name: Install rclone
        shell: powershell
        run: |

          $zip =
            "$env:TEMP\rclone.zip"

          $extract =
            "$env:TEMP\rclone"

          Write-Host "Downloading rclone..."

          Invoke-WebRequest `
            -Uri 'https://downloads.rclone.org/rclone-current-windows-amd64.zip' `
            -OutFile $zip `
            -UseBasicParsing

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          New-Item `
            -Path $extract `
            -ItemType Directory `
            -Force |
            Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $rclone =
            Get-ChildItem `
              -Path $extract `
              -Filter 'rclone.exe' `
              -Recurse |
            Select-Object -First 1

          if (-not $rclone) {
            throw 'rclone.exe was not found.'
          }

          Copy-Item `
            $rclone.FullName `
            'C:\Windows\System32\rclone.exe' `
            -Force

          rclone version


      # ============================================================
      # 8. PREPARE PERSISTENCE DIRECTORIES
      # ============================================================

      - name: Prepare persistence directories
        shell: powershell
        run: |

          $root = 'D:\RDPState'

          $directories = @(
            $root
            "$root\restore"
            "$root\stage"
            "$root\checkpoint"
          )

          foreach ($directory in $directories) {

            if (-not (Test-Path $directory)) {

              New-Item `
                -Path $directory `
                -ItemType Directory `
                -Force |
                Out-Null
            }
          }

          Write-Host "Persistence directories ready."


      # ============================================================
      # 9. RESTORE PREVIOUS STATE
      # ============================================================

      - name: Restore previous state
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |

          $remote =
            'mydrive:rdp-backups'

          $local =
            'D:\RDPState\restore'

          Write-Host "Checking persistent storage..."

          $metadata = $null

          try {

            $json =
              rclone cat `
                "$remote/current.json" `
                2>$null

            if ($json) {

              $metadata =
                $json |
                ConvertFrom-Json
            }

          }
          catch {

            Write-Host "No previous checkpoint found."
          }

          if (-not $metadata) {

            Write-Host "=========================================="
            Write-Host " FIRST RDP SESSION"
            Write-Host " No previous state exists."
            Write-Host "=========================================="

            exit 0
          }

          if ($metadata.status -ne 'READY') {

            Write-Warning `
              "Remote checkpoint exists but is not READY."

            exit 0
          }

          $generation =
            '{0:D6}' -f [int]$metadata.generation

          Write-Host "Restoring generation: $generation"

          $generationRemote =
            "$remote/generations/$generation"

          rclone copy `
            $generationRemote `
            $local `
            --progress

          if ($LASTEXITCODE -ne 0) {

            throw `
              "Failed to download persistent checkpoint."
          }

          Write-Host "Checkpoint downloaded."


      # ============================================================
      # 10. RESTORE USER FILES
      # ============================================================

      - name: Restore user files
        shell: powershell
        run: |

          $restore =
            'D:\RDPState\restore'

          $userSource =
            "$restore\User"

          if (-not (Test-Path $userSource)) {

            Write-Host "No saved user profile found."

            exit 0
          }

          $rdpUser =
            Get-ChildItem `
              'C:\Users' `
              -Directory |
            Where-Object {
              $_.Name -eq 'RDP'
            } |
            Select-Object -First 1

          if (-not $rdpUser) {

            throw 'RDP user profile was not created.'
          }

          $destination =
            $rdpUser.FullName

          Write-Host "Restoring user files..."

          robocopy `
            $userSource `
            $destination `
            /E `
            /XJ `
            /R:1 `
            /W:1 `
            /MT:16 `
            /NP `
            /XF `
              'NTUSER.DAT' `
              'NTUSER.DAT.LOG1' `
              'NTUSER.DAT.LOG2' `
              'ntuser.ini'

          if ($LASTEXITCODE -gt 7) {

            throw `
              "User profile restore failed. Robocopy code: $LASTEXITCODE"
          }

          Write-Host "User files restored."


      # ============================================================
      # 11. RESTORE APPLICATION LIST
      # ============================================================

      - name: Restore applications
        shell: powershell
        run: |

          $apps =
            'D:\RDPState\restore\apps.json'

          if (-not (Test-Path $apps)) {

            Write-Host "No application manifest found."

            exit 0
          }

          Write-Host "Restoring applications..."

          try {

            winget source reset --force

          }
          catch {

            Write-Warning `
              "winget source reset failed."
          }

          winget import `
            --import-file $apps `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable

          if ($LASTEXITCODE -ne 0) {

            Write-Warning `
              "Some applications could not be restored."
          }

          Write-Host "Application restoration completed."


      # ============================================================
      # 12. RESTORE REGISTRY SETTINGS
      # ============================================================

      - name: Restore user settings
        shell: powershell
        run: |

          $registry =
            'D:\RDPState\restore\user_settings.reg'

          if (-not (Test-Path $registry)) {

            Write-Host "No saved registry settings found."

            exit 0
          }

          Write-Host "Restoring registry settings..."

          reg.exe import $registry

          if ($LASTEXITCODE -ne 0) {

            Write-Warning `
              "Some registry settings could not be imported."
          }


      # ============================================================
      # 13. TELEGRAM READY MESSAGE
      # ============================================================

      - name: Send RDP ready notification
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_IP: ${{ env.TAILSCALE_IP }}
          RDP_PASS: ${{ env.RDP_CREDS }}
        run: |

          $message = @"
🚀 <b>Universal RDP Ready</b>

🌐 <b>IP:</b> <code>$env:RDP_IP</code>
👤 <b>User:</b> <code>RDP</code>
🔑 <b>Pass:</b> <code>$env:RDP_PASS</code>

✅ Previous environment restoration completed.
⏱️ Checkpoint scheduled at approximately 5h30m.
"@

          $telegramUrl =
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

          curl.exe `
            --fail `
            --silent `
            --show-error `
            --request POST `
            --url $telegramUrl `
            --data-urlencode "chat_id=$env:TELEGRAM_CHAT_ID" `
            --data-urlencode "text=$message" `
            --data-urlencode "parse_mode=HTML"

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Telegram notification failed."
          }


      # ============================================================
      # 14. RDP SESSION TIMER
      # ============================================================

      - name: Run RDP session
        shell: powershell
        run: |

          $checkpointMinutes = 330
          $start = Get-Date
          $last = -1

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host " Checkpoint: 330 minutes"
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {

            $elapsed =
              [math]::Floor(
                (
                  New-TimeSpan `
                    -Start $start `
                    -End (Get-Date)
                ).TotalMinutes
              )

            if ($elapsed -ne $last) {

              if (
                ($elapsed % 5 -eq 0) -or
                ($elapsed -ge 320)
              ) {

                $remaining =
                  $checkpointMinutes - $elapsed

                Write-Host `
                  "RDP Active | $elapsed minutes | $remaining minutes remaining"

                $last = $elapsed
              }
            }

            if ($elapsed -ge $checkpointMinutes) {
              break
            }

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "Checkpoint threshold reached."


      # ============================================================
      # 15. CREATE CHECKPOINT
      # ============================================================

      - name: Create persistent checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |

          $stage =
            'D:\RDPState\stage'

          $user =
            'D:\RDPState\stage\User'

          if (Test-Path $stage) {

            Remove-Item `
              $stage `
              -Recurse `
              -Force
          }

          New-Item `
            $stage `
            -ItemType Directory `
            -Force |
            Out-Null

          New-Item `
            $user `
            -ItemType Directory `
            -Force |
            Out-Null


          # --------------------------------------------------------
          # APPLICATION MANIFEST
          # --------------------------------------------------------

          Write-Host "Exporting installed applications..."

          winget export `
            --output "$stage\apps.json" `
            --include-versions `
            --accept-source-agreements

          if (-not (Test-Path "$stage\apps.json")) {

            Write-Warning `
              "winget did not create apps.json."
          }


          # --------------------------------------------------------
          # USER REGISTRY
          # --------------------------------------------------------

          Write-Host "Exporting user registry..."

          reg.exe export `
            'HKEY_CURRENT_USER\Software' `
            "$stage\user_settings.reg" `
            /y


          # --------------------------------------------------------
          # USER PROFILE
          # --------------------------------------------------------

          $rdpProfile =
            Get-ChildItem `
              'C:\Users' `
              -Directory |
            Where-Object {
              $_.Name -eq 'RDP'
            } |
            Select-Object -First 1

          if (-not $rdpProfile) {

            throw 'RDP profile could not be located.'
          }

          Write-Host `
            "Backing up profile: $($rdpProfile.FullName)"

          robocopy `
            $rdpProfile.FullName `
            $user `
            /E `
            /XJ `
            /R:1 `
            /W:1 `
            /MT:16 `
            /NP `
            /XD `
              "$($rdpProfile.FullName)\AppData\Local\Temp" `
              "$($rdpProfile.FullName)\AppData\Local\Microsoft\Windows" `
            /XF `
              'NTUSER.DAT' `
              'NTUSER.DAT.LOG1' `
              'NTUSER.DAT.LOG2' `
              'ntuser.ini'

          if ($LASTEXITCODE -gt 7) {

            throw `
              "Profile backup failed. Robocopy code: $LASTEXITCODE"
          }


          # --------------------------------------------------------
          # CREATE GENERATION
          # --------------------------------------------------------

          $timestamp =
            [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

          $generation =
            "$timestamp"

          $generationFolder =
            "D:\RDPState\checkpoint\$generation"

          New-Item `
            $generationFolder `
            -ItemType Directory `
-Force |
            Out-Null

          Copy-Item `
            "$stage\*" `
            $generationFolder `
            -Recurse `
            -Force


          # --------------------------------------------------------
          # METADATA
          # --------------------------------------------------------

          $metadata = @{
            status = 'READY'
            generation = $generation
            created_utc = [DateTime]::UtcNow.ToString('o')
          }

          $metadata |
            ConvertTo-Json -Depth 10 |
            Out-File `
              "$generationFolder\generation.json" `
              -Encoding utf8


          # --------------------------------------------------------
          # UPLOAD GENERATION
          # --------------------------------------------------------

          $remoteGeneration =
            "mydrive:rdp-backups/generations/$generation"

          Write-Host `
            "Uploading generation $generation..."

          rclone copy `
            $generationFolder `
            $remoteGeneration `
            --progress

          if ($LASTEXITCODE -ne 0) {

            throw `
              "Generation upload failed."
          }


          # --------------------------------------------------------
          # PUBLISH CURRENT.JSON ONLY AFTER SUCCESSFUL UPLOAD
          # --------------------------------------------------------

          $metadata |
            ConvertTo-Json -Depth 10 |
            Out-File `
              'D:\RDPState\checkpoint\current.json' `
              -Encoding utf8

          rclone copyto `
            'D:\RDPState\checkpoint\current.json' `
            'mydrive:rdp-backups/current.json' `
            --progress

          if ($LASTEXITCODE -ne 0) {

            throw `
              "current.json publication failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " CHECKPOINT READY"
          Write-Host " Generation: $generation"
          Write-Host "=========================================="
          Write-Host ""


      # ============================================================
      # 16. VERIFY CHECKPOINT
      # ============================================================

      - name: Verify checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |

          $json =
            rclone cat `
              'mydrive:rdp-backups/current.json'

          if (-not $json) {

            throw 'current.json does not exist.'
          }

          $metadata =
            $json |
            ConvertFrom-Json

          if ($metadata.status -ne 'READY') {

            throw 'Checkpoint is not READY.'
          }

          if (-not $metadata.generation) {

            throw 'Checkpoint has no generation.'
          }

          $generation =
            $metadata.generation

          Write-Host `
            "Verified generation: $generation"

          rclone lsf `
            "mydrive:rdp-backups/generations/$generation"

          if ($LASTEXITCODE -ne 0) {

            throw `
              "Checkpoint generation could not be verified."
          }

          Write-Host ""
          Write-Host "Checkpoint verified successfully."


      # ============================================================
      # 17. START NEXT WORKFLOW
      # ============================================================

      - name: Start next RDP session
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |

          if (-not $env:GH_PAT) {

            throw `
              'GH_PAT secret is missing.'
          }

          $repository =
            '${{ github.repository }}'

          # IMPORTANT:
          # This file is main.yml.
          $workflow =
            'main.yml'

          $uri =
            "https://api.github.com/repos/$repository/actions/workflows/$workflow/dispatches"

          $headers = @{
            Authorization =
              "Bearer $env:GH_PAT"

            Accept =
              'application/vnd.github+json'

            'X-GitHub-Api-Version' =
              '2022-11-28'

            'User-Agent' =
              'RDP-Persistence'
          }

          $body = @{
            ref = 'main'
          } |
          ConvertTo-Json

          $response =
            Invoke-WebRequest `
              -Uri $uri `
              -Method POST `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body `
              -UseBasicParsing

          Write-Host `
            "GitHub dispatch response: $($response.StatusCode)"

          if ($response.StatusCode -ne 204) {

            throw `
              "GitHub did not accept the workflow dispatch."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " NEXT RDP WORKFLOW DISPATCHED"
          Write-Host "=========================================="


      # ============================================================
      # 18. FINAL STATUS
      # ============================================================

      - name: Final status
        if: always()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          $status =
            '${{ job.status }}'

          if ($status -eq 'success') {

            $message = @"
🔄 <b>RDP Session Transitioned</b>

✅ Persistent checkpoint created
✅ Remote checkpoint verified
✅ Next RDP workflow dispatched

The next runner will restore the latest READY generation.
"@

          }
          else {

            $message = @"
⚠️ <b>RDP Transition Failed</b>

Status:
<code>$status</code>

The previous READY checkpoint remains untouched.
"@

          }

          if ($env:TELEGRAM_TOKEN -and $env:TELEGRAM_CHAT_ID) {

            $telegramUrl =
              "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

            curl.exe `
              --fail `
              --silent `
              --show-error `
              --request POST `
              --url $telegramUrl `
              --data-urlencode "chat_id=$env:TELEGRAM_CHAT_ID" `
              --data-urlencode "text=$message" `
              --data-urlencode "parse_mode=HTML"

            if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                'Final Telegram notification failed.'
            }
          }
     