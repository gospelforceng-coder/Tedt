name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-latest

    # 6 hours = 360 minutes.
    # We checkpoint at 5h30m.
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY PERSISTENCE SCRIPTS
      # ============================================================

      - name: Verify persistence system
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "$env:GITHUB_WORKSPACE\persistence\capture-baseline.ps1",
            "$env:GITHUB_WORKSPACE\persistence\restore.ps1",
            "$env:GITHUB_WORKSPACE\persistence\checkpoint.ps1"
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Required persistence file is missing: $file"
            }

            Write-Host "Found: $file"
          }

          Write-Host "Persistence system verified."


      # ============================================================
      # 3. CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration completed."


      # ============================================================
      # 4. CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $upper = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          $lower = [char[]]"abcdefghijklmnopqrstuvwxyz"
          $numbers = [char[]]"0123456789"
          $special = [char[]]"!@#$%^&*"

          $chars = @()

          $chars += $upper | Get-Random -Count 4
          $chars += $lower | Get-Random -Count 4
          $chars += $numbers | Get-Random -Count 4
          $chars += $special | Get-Random -Count 4

          $password = -join (
            $chars | Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          }
          else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          $adminMember = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\RDP$"
            }

          if (-not $adminMember) {
            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"
          }

          $rdpMember = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\RDP$"
            }

          if (-not $rdpMember) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"
          }

          "RDP_CREDS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "RDP user configured."


      # ============================================================
      # 5. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -NoNewWindow

          Remove-Item `
            -LiteralPath $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # 6. CONNECT TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=rdp-node"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect."
          }

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {

            $ip = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Tailscale did not obtain an IPv4 address."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IPv4: $ip"


      # ============================================================
      # 7. INSTALL RCLONE
      # ============================================================

      - name: Install rclone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone_extract"

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $rclone = Get-ChildItem `
            -Path $extract `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $rclone) {
            throw "rclone.exe was not found."
          }

          Copy-Item `
            -LiteralPath $rclone.FullName `
            -Destination "C:\Windows\System32\rclone.exe" `
            -Force

          rclone version


      # ============================================================
      # 8. SEND READY MESSAGE
      # ============================================================

      - name: Send RDP ready notification
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_PASS: ${{ env.RDP_CREDS }}
          RDP_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TELEGRAM_TOKEN) {
            throw "TELEGRAM_BOT_TOKEN is missing."
          }

          if (-not $env:TELEGRAM_CHAT_ID) {
            throw "TELEGRAM_CHAT_ID is missing."
          }

          $safeIP = [System.Net.WebUtility]::HtmlEncode(
            [string]$env:RDP_IP
          )

          $safePassword = [System.Net.WebUtility]::HtmlEncode(
            [string]$env:RDP_PASS
          )

          $message = @"
🚀 <b>Universal RDP Ready</b>

🌐 <b>IP:</b> <code>$safeIP</code>
👤 <b>User:</b> <code>RDP</code>
🔑 <b>Pass:</b> <code>$safePassword</code>

<i>Checking for your previous environment...</i>
"@

          $payload = @{
            chat_id    = $env:TELEGRAM_CHAT_ID
            text       = $message
            parse_mode = "HTML"
          }

          $json = $payload | ConvertTo-Json -Depth 10

          # Write the JSON as actual UTF-8.
          $telegramFile = Join-Path `
            $env:RUNNER_TEMP `
            "telegram_ready.json"

          [System.IO.File]::WriteAllText(
            $telegramFile,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            -X POST `
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -H "Content-Type: application/json; charset=utf-8" `
            --data-binary "@$telegramFile"

          if ($LASTEXITCODE -ne 0) {
            throw "Telegram request failed."
          }


      # ============================================================
      # 9. PREPARE STATE DIRECTORIES
      # ============================================================

      - name: Prepare persistence directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $directories = @(
            "D:\RDPState",
            "D:\RDPState\restore",
            "D:\RDPState\stage",
            "D:\RDPState\checkpoints"
          )

          foreach ($directory in $directories) {

            if (-not (Test-Path $directory)) {

              New-Item `
                -Path $directory `
                -ItemType Directory `
                -Force |
                Out-Null
            }
          }


      # ============================================================
      # 10. CAPTURE BASELINE
      # ============================================================

      - name: Capture fresh Windows baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:GITHUB_WORKSPACE\persistence\capture-baseline.ps1" `
            -OutputPath "D:\RDPState\baseline.json"

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline capture failed."
          }


      # ============================================================
      # 11. RESTORE PREVIOUS STATE
      # ============================================================

      - name: Restore previous RDP environment
        shell: pwsh
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RDP_PASSWORD: ${{ env.RDP_CREDS }}

        run: |
          $ErrorActionPreference = "Stop"

          & "$env:GITHUB_WORKSPACE\persistence\restore.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -LocalRoot "D:\RDPState\restore" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            throw "Environment restoration failed."
          }


      # ============================================================
      # 12. RESTORED NOTIFICATION
      # ============================================================

      - name: Notify environment restored
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ErrorActionPreference = "Stop"

          $safeIP = [System.Net.WebUtility]::HtmlEncode(
            [string]$env:RDP_IP
          )

          $message = @"
✅ <b>RDP Environment Restored</b>

🌐 <b>IP:</b> <code>$safeIP</code>
👤 <b>User:</b> <code>RDP</code>

Your latest available persistent environment has been restored.

⏱️ Automatic checkpoint: approximately 5h30m.
"@

          $payload = @{
            chat_id    = $env:TELEGRAM_CHAT_ID
            text       = $message
            parse_mode = "HTML"
          }

          $json = $payload | ConvertTo-Json -Depth 10

          $telegramFile = Join-Path `
            $env:RUNNER_TEMP `
            "telegram_restored.json"

          [System.IO.File]::WriteAllText(
            $telegramFile,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            -X POST `
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -H "Content-Type: application/json; charset=utf-8" `
            --data-binary "@$telegramFile"

          if ($LASTEXITCODE -ne 0) {
            throw "Telegram request failed."
          }


      # ============================================================
      # 13. SESSION TIMER
      # ============================================================

      - name: Run RDP session timer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sessionStart = Get-Date

          # 5 hours 30 minutes.
          $checkpointAfterMinutes = 330

          Write-Host ""
          Write-Host "==========================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host " CHECKPOINT: 330 MINUTES"
          Write-Host "==========================================="
          Write-Host ""

          $lastLogged = -1

          while ($true) {

            $elapsed = [math]::Floor(
              (
                New-TimeSpan `
                  -Start $sessionStart `
                  -End (Get-Date)
              ).TotalMinutes
            )

            if (
              $elapsed -ne $lastLogged -and
              (
                ($elapsed % 5) -eq 0 -or
                $elapsed -ge 325
              )
            ) {

              $remaining =
                $checkpointAfterMinutes - $elapsed

              Write-Host `
                "RDP Active | $elapsed min elapsed | $remaining min remaining"

              $lastLogged = $elapsed
            }

            if ($elapsed -ge $checkpointAfterMinutes) {
              break
            }

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "Checkpoint threshold reached." -ForegroundColor Yellow


      # ============================================================
      # 14. CREATE CHECKPOINT
      # ============================================================

      - name: Create persistent checkpoint
        shell: pwsh
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RDP_PASSWORD: ${{ env.RDP_CREDS }}

        run: |
          $ErrorActionPreference = "Stop"

          & "$env:GITHUB_WORKSPACE\persistence\checkpoint.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -StageRoot "D:\RDPState\stage" `
            -LocalCheckpointRoot "D:\RDPState\checkpoints" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            throw "Checkpoint creation failed."
          }


      # ============================================================
      # 15. VERIFY CHECKPOINT
      # ============================================================

      - name: Verify checkpoint
        shell: pwsh
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Reading current checkpoint metadata..."

          $current = rclone cat `
            "mydrive:rdp-backups/current.json"

          if ($LASTEXITCODE -ne 0 -or -not $current) {
            throw "current.json could not be read."
          }

          Write-Host $current

          $metadata = $current | ConvertFrom-Json

          if ($metadata.status -ne "READY") {
            throw "Checkpoint status is not READY."
          }

          if ($null -eq $metadata.generation) {
            throw "Checkpoint generation is missing."
          }

          $generation = "{0:D6}" -f `
            [int]$metadata.generation

          Write-Host ""
          Write-Host "Verified generation: $generation"

          rclone lsf `
            "mydrive:rdp-backups/generations/$generation/" `
            --max-depth 1

          if ($LASTEXITCODE -ne 0) {
            throw "Checkpoint generation could not be verified."
          }

          Write-Host ""
          Write-Host "Checkpoint successfully verified." `
            -ForegroundColor Green


      # ============================================================
      # 16. DISPATCH NEXT SESSION
      # ============================================================

      - name: Start next RDP session
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:GH_PAT) {
            throw "GH_PAT secret is missing."
          }

          $repository = "${{ github.repository }}"

          # IMPORTANT:
          # The workflow file is main.yml.
          $workflow = "main.yml"

          $uri =
            "https://api.github.com/repos/$repository/actions/workflows/$workflow/dispatches"

          $headers = @{
            Authorization = "Bearer $env:GH_PAT"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "RDP-Persistence"
          }

          $payload = @{
            ref = "main"
          }

          $json = $payload | ConvertTo-Json

          $dispatchFile = Join-Path `
            $env:RUNNER_TEMP `
            "github_dispatch.json"

          [System.IO.File]::WriteAllText(
            $dispatchFile,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          $curlHeaders = @(
            "-H", "Authorization: Bearer $env:GH_PAT",
            "-H", "Accept: application/vnd.github+json",
            "-H", "X-GitHub-Api-Version: 2022-11-28",
            "-H", "User-Agent: RDP-Persistence",
            "-H", "Content-Type: application/json"
          )

          & curl.exe `
            --fail-with-body `
            --silent `
            --show-error `
            -X POST `
            $uri `
            @curlHeaders `
            --data-binary "@$dispatchFile"

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub failed to dispatch the next RDP workflow."
          }

          Write-Host ""
          Write-Host "NEXT RDP SESSION DISPATCHED." `
            -ForegroundColor Green


      # ============================================================
      # 17. FINAL STATUS
      # ============================================================

      - name: Send transition notification
        if: always()
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          $status = "${{ job.status }}"

          if ($status -eq "success") {

            $message = @"
🔄 <b>RDP Session Transitioned</b>

✅ Previous state backed up
✅ Checkpoint verified
✅ Next RDP workflow dispatched

The next runner will restore the latest READY generation.
"@

          }
          else {

            $message = @"
⚠️ <b>RDP Transition Failed</b>

Status:
<code>$status</code>

The last successfully published checkpoint remains available.
"@
          }

          $payload = @{
            chat_id    = $env:TELEGRAM_CHAT_ID
            text       = $message
            parse_mode = "HTML"
          }

          $json = $payload | ConvertTo-Json -Depth 10

          $telegramFile = Join-Path `
            $env:RUNNER_TEMP `
            "telegram_final.json"

          [System.IO.File]::WriteAllText(
            $telegramFile,
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )

          curl.exe `
            --silent `
            --show-error `
            -X POST `
            "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -H "Content-Type: application/json; charset=utf-8" `
            --data-binary "@$telegramFile"

          # Notification failure must not change the actual
          # checkpoint result.
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Final Telegram notification failed."
          }