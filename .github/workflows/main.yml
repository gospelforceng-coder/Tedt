name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest

    # Stay below the hosted-runner limit.
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout persistence system
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP configured."


      # ============================================================
      # 3. CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $upper   = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          $lower   = [char[]]"abcdefghijklmnopqrstuvwxyz"
          $number  = [char[]]"0123456789"
          $special = [char[]]"!@#$%^&*"

          $passwordChars = @()

          $passwordChars += $upper   | Get-Random -Count 4
          $passwordChars += $lower   | Get-Random -Count 4
          $passwordChars += $number  | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join (
            $passwordChars |
            Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires

          }
          else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          $groups = @(
            "Administrators",
            "Remote Desktop Users"
          )

          foreach ($group in $groups) {

            try {
              Add-LocalGroupMember `
                -Group $group `
                -Member "RDP" `
                -ErrorAction Stop
            }
            catch {
              # Already a member.
            }
          }

          "RDP_CREDS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "RDP user configured."


      # ============================================================
      # 4. INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # 5. CONNECT TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = `
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=rdp-node"

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {

            $ip = (
              & $tailscale ip -4 2>$null |
              Select-Object -First 1
            )

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Tailscale did not obtain an IPv4 address."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IP: $ip"


      # ============================================================
      # 6. INSTALL RCLONE
      # ============================================================

      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone"

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $binary = Get-ChildItem `
            -Path $extract `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $binary) {
            throw "rclone.exe was not found."
          }

          Copy-Item `
            $binary.FullName `
            "C:\Windows\System32\rclone.exe" `
            -Force

          rclone version


      # ============================================================
      # 7. CREATE STATE DIRECTORIES
      # ============================================================

      - name: Initialize persistence directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $directories = @(
            "D:\RDPState",
            "D:\RDPState\baseline",
            "D:\RDPState\restore",
            "D:\RDPState\stage",
            "D:\RDPState\checkpoint"
          )

          foreach ($directory in $directories) {

            if (-not (Test-Path $directory)) {

              New-Item `
                -Path $directory `
                -ItemType Directory `
                -Force |
                Out-Null
            }
          }


      # ============================================================
      # 8. CAPTURE BASELINE
      # ============================================================

      - name: Capture Windows baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\capture-baseline.ps1" `
            -OutputPath "D:\RDPState\baseline\baseline.json"

          if ($LASTEXITCODE -ne 0) {
            throw "Baseline capture failed."
          }


      # ============================================================
      # 9. RESTORE PREVIOUS STATE
      # ============================================================

      - name: Restore previous environment
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\restore.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -LocalRoot "D:\RDPState\restore" `
            -UserName "RDP"

          if ($LASTEXITCODE -ne 0) {
            throw "Restore failed."
          }


      # ============================================================
      # 10. TELEGRAM READY
      # ============================================================

      - name: Send RDP ready notification
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_PASS: ${{ env.RDP_CREDS }}
          RDP_IP: ${{ env.TAILSCALE_IP }}

        run: |
          $ErrorActionPreference = "Stop"

          $ip = [System.Net.WebUtility]::HtmlEncode(
            [string]$env:RDP_IP
          )

          $pass = [System.Net.WebUtility]::HtmlEncode(
            [string]$env:RDP_PASS
          )

          $message = @"
🚀 <b>RDP Ready</b>

🌐 <b>IP:</b> <code>$ip</code>
👤 <b>User:</b> <code>RDP</code>
🔑 <b>Pass:</b> <code>$pass</code>

✅ Previous persistent state has been restored.
"@

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          }

          $json = $payload | ConvertTo-Json -Depth 10

          # Windows PowerShell 5.1 compatible.
          $utf8 = New-Object `
            System.Text.UTF8Encoding(
              $false
            )

          $bytes = $utf8.GetBytes($json)

          Add-Type -AssemblyName System.Net.Http

          $client = New-Object System.Net.Http.HttpClient
          $content = New-Object System.Net.Http.ByteArrayContent($bytes)

          try {

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $uri =
              "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $responseText =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().GetResult()

            Write-Host $responseText

            if (-not $response.IsSuccessStatusCode) {
              throw "Telegram failed: $responseText"
            }
          }
          finally {

            $content.Dispose()
            $client.Dispose()
          }


      # ============================================================
      # 11. SESSION TIMER
      # ============================================================

      - name: Run RDP session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sessionStart = Get-Date

          # 320 minutes = 5h20m.
          # This leaves approximately 30 minutes for checkpointing
          # before the workflow timeout.
          $checkpointMinute = 320

          Write-Host ""
          Write-Host "======================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host " CHECKPOINT: 320 MINUTES"
          Write-Host "======================================="
          Write-Host ""

          while ($true) {

            $elapsed = [math]::Floor(
              (
                New-TimeSpan `
                  -Start $sessionStart `
                  -End (Get-Date)
              ).TotalMinutes
            )

            if (($elapsed % 5) -eq 0) {

              $remaining =
                $checkpointMinute - $elapsed

              Write-Host `
                "RDP Active | $elapsed minutes | $remaining minutes to checkpoint"
            }

            if ($elapsed -ge $checkpointMinute) {
              break
            }

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "Checkpoint threshold reached."


      # ============================================================
      # 12. CREATE CHECKPOINT
      # ============================================================

      - name: Create persistent checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\checkpoint.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -StageRoot "D:\RDPState\stage" `
            -LocalCheckpointRoot "D:\RDPState\checkpoint" `
            -UserName "RDP"

          if ($LASTEXITCODE -ne 0) {
            throw "Checkpoint creation failed."
          }


      # ============================================================
      # 13. VERIFY CHECKPOINT
      # ============================================================

      - name: Verify checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: drive
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $metadataPath =
            "mydrive:rdp-backups/current.json"

          $current =
            rclone cat $metadataPath

          if (-not $current) {
            throw "No current checkpoint was published."
          }

          Write-Host $current

          $metadata =
            $current | ConvertFrom-Json

          if ($metadata.status -ne "READY") {
            throw "Checkpoint is not READY."
          }

          if (-not $metadata.generation) {
            throw "Checkpoint has no generation."
          }

          Write-Host ""
          Write-Host "Checkpoint verified successfully." `
            -ForegroundColor Green


      # ============================================================
      # 14. FINAL STATUS
      # ============================================================

      - name: Send checkpoint notification
        if: always()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          Add-Type -AssemblyName System.Net.Http

          $status = "${{ job.status }}"

          if ($status -eq "success") {

            $message = @"
🔄 <b>RDP Checkpoint Complete</b>

✅ Your persistent state was saved.
✅ Remote checkpoint was verified.

The current session can now end safely.
The next RDP session can restore this checkpoint.
"@

          }
          else {

            $message = @"
⚠️ <b>RDP Checkpoint Failed</b>

Status:
<code>$status</code>

The previous successfully published checkpoint remains available.
"@
          }

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          }

          $json =
            $payload |
            ConvertTo-Json -Depth 10

          $utf8 =
            New-Object System.Text.UTF8Encoding($false)

          $bytes =
            $utf8.GetBytes($json)

          $client =
            New-Object System.Net.Http.HttpClient

          $content =
            New-Object System.Net.Http.ByteArrayContent($bytes)

          try {

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $uri =
              "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $body =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().GetResult()

            Write-Host $body

          }
          finally {

            $content.Dispose()
            $client.Dispose()
          }