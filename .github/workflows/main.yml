name: RDP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:        
      #################################################################        
      # 1️⃣ Core RDP & System Configuration
      #################################################################        
      - name: Configure Core RDP Settings        
        run: |        
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force        
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force        
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force        
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null       
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389        
          Restart-Service -Name TermService -Force        

      #################################################################        
      # 2️⃣ Create RDP User
      #################################################################        
      - name: Create RDP User
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            Lower   = [char[]]"abcdefghijklmnopqrstuvwxyz"
            Number  = [char[]]"0123456789"
            Special = [char[]]"!@#$%^&*"
          }
          $rawPassword = @()        
          $rawPassword += $charSet.Upper | Get-Random -Count 4        
          $rawPassword += $charSet.Lower | Get-Random -Count 4        
          $rawPassword += $charSet.Number | Get-Random -Count 4        
          $rawPassword += $charSet.Special | Get-Random -Count 4        
          $password = -join ($rawPassword | Sort-Object { Get-Random })        
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force        
          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue        
          if (-not $user) {        
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires        
            Add-LocalGroupMember -Group "Administrators" -Member "RDP"        
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"        
          }        
          echo "RDP_CREDS=$password" >> $env:GITHUB_ENV

      #################################################################        
      # 3️⃣ Checkout Repository & Install Tooling
      #################################################################        
      - name: Checkout Repository Scripts
        uses: actions/checkout@v4

      - name: Install Essential Tooling & Clone ReWin
        run: |
          # Install RClone
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip        
          Expand-Archive rclone.zip -DestinationPath $env:TEMP        
          Copy-Item "$env:TEMP\rclone*\rclone.exe" "C:\Windows\System32\rclone.exe" -Force

          # Install Tailscale
          $url="https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"        
          $file="$env:TEMP\tailscale.msi"        
          Invoke-WebRequest $url -OutFile $file        
          Start-Process msiexec.exe -ArgumentList "/i `"$file`" /quiet /norestart" -Wait        
          Remove-Item $file -Force

          # Install Python 3.11 for ReWin scripts
          winget install --id Python.Python.3.11 --exact --silent --accept-source-agreements --accept-package-agreements        
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")        

          # Clone ReWin framework into target tools path
          New-Item -ItemType Directory -Path "D:\RDPState\tools" -Force | Out-Null
          git clone https://github.com/Jany-M/ReWin.git "D:\RDPState\tools\ReWin"

      #################################################################        
      # 4️⃣ Capture Baseline & Run State Restore
      #################################################################        
      - name: Capture Baseline & Restore Environment State
        env:        
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"        
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}        
          RDP_PASS: ${{ env.RDP_CREDS }}
        run: |
          # 1. Force initial user profile creation for RDP user
          $secStr = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force    
          $cred = New-Object System.Management.Automation.PSCredential("RDP", $secStr)    
          Start-Job -ScriptBlock { whoami } -Credential $cred | Wait-Job

          # 2. Capture baseline using workspace persistence folder path
          $captureScript = Join-Path $env:GITHUB_WORKSPACE "persistence\capture-baseline.ps1"
          powershell -ExecutionPolicy Bypass -File "$captureScript" -OutputPath "D:\RDPState\baseline.json"

          # 3. Restore state using workspace persistence folder path
          $restoreScript = Join-Path $env:GITHUB_WORKSPACE "persistence\restore-state.ps1"
          powershell -ExecutionPolicy Bypass -File "$restoreScript" `
            -RemoteRoot "mydrive:rdp-backups" `
            -LocalRoot "D:\RDPState\restore" `
            -ReWinRoot "D:\RDPState\tools\ReWin" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_PASS"

      #################################################################        
      # 5️⃣ Tailscale Connection & Telegram Dispatch
      #################################################################        
      - name: Establish Tailscale & Notify Telegram
        env:        
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}        
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}        
          RDP_PASS: ${{ env.RDP_CREDS }}        
        run: |        
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-node        
          $ip=$null        
          for ($i=0;$i -lt 10;$i++){        
            $ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4        
            if($ip){break}        
            Start-Sleep 5        
          }        
          if(-not $ip){exit 1}        
          
          $message = @"
          🚀 <b>RDP Ready & Environment Synced</b>

          🌐 <b>IP:</b> <code>$ip</code>
          👤 <b>User:</b> <code>RDP</code>
          🔑 <b>Pass:</b> <code>$($env:RDP_PASS)</code>

          <i>System state, software diffs, and configs fully restored!</i>
          "@
          $url = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"          
          $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $message; parse_mode = "HTML" } | ConvertTo-Json          
          Invoke-RestMethod -Uri $url -Method Post -ContentType "application/json" -Body $body

      #################################################################        
      # 6️⃣ Monitor Session & Trigger Automated ReWin Backup
      #################################################################        
      - name: Idle Loop & Checkpoint Backup
        env:        
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"        
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}        
          GH_PAT: ${{ secrets.GH_PAT }}        
          RDP_PASS: ${{ env.RDP_CREDS }}
        run: |        
          $start = Get-Date    
          $lastLog = -1    
          while ($true) {    
            $elapsed = [math]::Floor((New-TimeSpan -Start $start -End (Get-Date)).TotalMinutes)    
            if ($elapsed -gt $lastLog) {    
                Write-Host "RDP Active | Session Time: $elapsed min / 330 min cutoff"    
                $lastLog = $elapsed    
            }    

            # Run state backup at 5.5 hours (330 mins)
            if ($elapsed -ge 330) {    
              Write-Host "⏳ Cutoff reached. Executing ReWin Checkpoint Backup..." -ForegroundColor Yellow
              
              $backupScript = Join-Path $env:GITHUB_WORKSPACE "persistence\backup-state.ps1"
              powershell -ExecutionPolicy Bypass -File "$backupScript" `
                -ReWinRoot "D:\RDPState\tools\ReWin" `
                -StageRoot "D:\RDPState\stage" `
                -LocalCheckpointRoot "D:\RDPState\checkpoints" `
                -RemoteRoot "mydrive:rdp-backups" `
                -UserName "RDP" `
                -UserPassword "$env:RDP_PASS"

              # Re-trigger GitHub Action workflow chain
              Write-Host "🔄 Triggering new workflow dispatch..." -ForegroundColor Green
              $uri = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches"    
              Invoke-RestMethod -Uri $uri -Method POST -Headers @{Authorization="token $env:GH_PAT"; Accept="application/vnd.github+json"} -Body '{"ref":"main"}'    
              break    
            }    
            Start-Sleep 60    
          }

      - name: Notify Workflow Transition
        if: always()        
        env:        
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}        
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}        
        run: |        
          $status = "${{ job.status }}"    
          $message = "🏁 <b>RDP Session Ended</b>`nStatus: <b>$status</b>`nNext instance spinning up."    
          $url = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"    
          $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $message; parse_mode = "HTML" } | ConvertTo-Json    
          Invoke-RestMethod -Uri $url -Method Post -ContentType "application/json" -Body $body
