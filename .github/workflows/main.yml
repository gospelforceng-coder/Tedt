name: RDP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secure-rdp:

    runs-on: windows-latest

    # 6 hours = 360 minutes.
    # We checkpoint at 330 minutes to leave transition time.
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout persistence system
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configure Core RDP Settings
      # ============================================================

      - name: Configure Core RDP Settings
        shell: powershell
        run: |

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service `
            -Name TermService `
            -Force


      # ============================================================
      # 3. Create RDP User
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{
            Upper   = [char[]]"ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            Lower   = [char[]]"abcdefghijklmnopqrstuvwxyz"
            Number  = [char[]]"0123456789"
            Special = [char[]]"!@#$%^&*"
          }

          $rawPassword = @()

          $rawPassword += `
            $charSet.Upper |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Lower |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Number |
            Get-Random -Count 4

          $rawPassword += `
            $charSet.Special |
            Get-Random -Count 4

          $password =
            -join (
              $rawPassword |
              Sort-Object {
                Get-Random
              }
            )

          $securePass =
            ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $user =
            Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if (!$user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "RDP"

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"
          }
          else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePass
          }

          "RDP_CREDS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ============================================================
      # 4. Install Tailscale
      # ============================================================

      - name: Install Tailscale
        shell: powershell
        run: |

          $url =
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $file =
            "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $file `
            -Force


      # ============================================================
      # 5. Connect Tailscale
      # ============================================================

      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          & "$env:ProgramFiles\Tailscale\tailscale.exe" `
            up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=rdp-node

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {

            $ip =
              & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (!$ip) {
            throw "Tailscale did not obtain an IPv4 address."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append


      # ============================================================
      # 6. Install rclone
      # ============================================================

      - name: Install rclone
        shell: powershell
        run: |

          $zip =
            "$env:TEMP\rclone.zip"

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          $extract =
            "$env:TEMP\rclone_extract"

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $rclone =
            Get-ChildItem `
              $extract `
              -Recurse `
              -Filter "rclone.exe" |
            Select-Object -First 1

          if (!$rclone) {
            throw "rclone.exe was not found."
          }

          Copy-Item `
            $rclone.FullName `
            "C:\Windows\System32\rclone.exe" `
            -Force

          rclone version


      # ============================================================
      # 7. Telegram helper
      #
      # IMPORTANT:
      # Windows PowerShell 5.1 can serialize Invoke-RestMethod
      # request bodies using a non-UTF8 encoding.
      #
      # We explicitly use .NET HttpClient + UTF8 here.
      # ============================================================

      - name: Define Telegram notification function
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          $message = @"
          🚀 <b>Universal RDP Ready</b>

          🌐 <b>IP:</b> <code>${{ env.TAILSCALE_IP }}</code>
          👤 <b>User:</b> <code>RDP</code>
          🔑 <b>Pass:</b> <code>${{ env.RDP_CREDS }}</code>

          <i>Restoring your previous environment...</i>
          "@

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          }

          $json =
            $payload |
            ConvertTo-Json -Depth 10

          $encoded =
            [System.Text.Encoding]::UTF8.GetBytes($json)

          $handler =
            New-Object System.Net.Http.HttpClientHandler

          $client =
            New-Object System.Net.Http.HttpClient($handler)

          try {

            $content =
              New-Object System.Net.Http.ByteArrayContent($encoded)

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $uri =
              "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $responseBody =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().
              GetResult()

            Write-Host $responseBody

            if (!$response.IsSuccessStatusCode) {
              throw "Telegram request failed: $responseBody"
            }
          }
          finally {
            $content.Dispose()
            $client.Dispose()
          }


      # ============================================================
      # 8. Capture fresh runner baseline
      #
      # This is deliberately done AFTER the runner is provisioned
      # but BEFORE restoring the previous user's custom software.
      # ============================================================

      - name: Capture fresh Windows baseline
        shell: powershell
        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\capture-baseline.ps1" `
            -OutputPath "D:\RDPState\baseline.json"


      # ============================================================
      # 9. Restore previous state
      # ============================================================

      - name: Restore previous RDP environment
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\restore.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -LocalRoot "D:\RDPState\restore" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_CREDS"


      # ============================================================
      # 10. Notify that restoration completed
      # ============================================================

      - name: Notify Environment Restored
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          $message = @"
          ✅ <b>RDP Environment Restored</b>

          🖥️ <b>IP:</b> <code>${{ env.TAILSCALE_IP }}</code>
          👤 <b>User:</b> <code>RDP</code>

          Your previous persistent environment has been restored.

          The session is now active.
          Automatic checkpoint begins near the 5h30m mark.
          "@

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          }

          $json =
            $payload |
            ConvertTo-Json -Depth 10

          $encoded =
            [System.Text.Encoding]::UTF8.GetBytes($json)

          $client =
            New-Object System.Net.Http.HttpClient

          try {

            $content =
              New-Object System.Net.Http.ByteArrayContent($encoded)

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $uri =
              "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $body =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().
              GetResult()

            Write-Host $body

            if (!$response.IsSuccessStatusCode) {
              throw "Telegram notification failed: $body"
            }
          }
          finally {
            $content.Dispose()
            $client.Dispose()
          }


      # ============================================================
      # 11. SESSION TIMER
      #
      # 330 minutes = 5h30m
      #
      # This leaves approximately 30 minutes before the six-hour
      # runner limit for:
      #
      #   - ReWin scanning
      #   - file backup
      #   - software inventory
      #   - compression
      #   - upload
      #   - validation
      #   - dispatching next workflow
      # ============================================================

      - name: Run RDP session timer
        shell: powershell
        run: |

          $sessionStart = Get-Date

          $checkpointAfterMinutes = 330

          Write-Host ""
          Write-Host "==============================================" `
            -ForegroundColor Cyan

          Write-Host `
            "RDP SESSION STARTED" `
            -ForegroundColor Cyan

          Write-Host `
            "Checkpoint target: $checkpointAfterMinutes minutes" `
            -ForegroundColor Cyan

          Write-Host "==============================================" `
            -ForegroundColor Cyan

          $lastLoggedMinute = -1

          while ($true) {

            $elapsed =
              [math]::Floor(
                (
                  New-TimeSpan `
                    -Start $sessionStart `
                    -End (Get-Date)
                ).TotalMinutes
              )

            if (
              $elapsed -ne $lastLoggedMinute -and
              (
                $elapsed % 5 -eq 0 -or
                $elapsed -ge 325
              )
            ) {

              $remaining =
                $checkpointAfterMinutes - $elapsed

              Write-Host `
                "RDP Active | $elapsed min elapsed | $remaining min until checkpoint"

              $lastLoggedMinute = $elapsed
            }

            if ($elapsed -ge $checkpointAfterMinutes) {
              break
            }

            Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host `
            "Checkpoint threshold reached." `
            -ForegroundColor Yellow


      # ============================================================
      # 12. Create checkpoint
      # ============================================================

      - name: Create persistent checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |

          powershell `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\persistence\checkpoint.ps1" `
            -RemoteRoot "mydrive:rdp-backups" `
            -StageRoot "D:\RDPState\stage" `
            -LocalCheckpointRoot "D:\RDPState\checkpoints" `
            -UserName "RDP" `
            -UserPassword "$env:RDP_CREDS"


      # ============================================================
      # 13. Verify checkpoint exists remotely
      # ============================================================

      - name: Verify remote checkpoint
        shell: powershell
        env:
          RCLONE_CONFIG_MYDRIVE_TYPE: "drive"
          RCLONE_CONFIG_MYDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}

        run: |

          Write-Host "Checking published checkpoint..."

          $current =
            rclone cat `
              "mydrive:rdp-backups/current.json"

          if (!$current) {
            throw "current.json was not published."
          }

          Write-Host $current

          $metadata =
            $current |
            ConvertFrom-Json

          if ($metadata.status -ne "READY") {
            throw "Remote checkpoint is not marked READY."
          }

          $generation =
            "{0:D6}" -f [int]$metadata.generation

          Write-Host `
            "Published generation: $generation"

          rclone lsf `
            "mydrive:rdp-backups/generations/$generation/" `
            --max-depth 1

          if ($LASTEXITCODE -ne 0) {
            throw "Remote generation could not be verified."
          }


      # ============================================================
      # 14. Dispatch next RDP
      #
      # IMPORTANT:
      # The next RDP is only started AFTER the checkpoint is
      # successfully uploaded and verified.
      # ============================================================

      - name: Start next RDP session
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

        run: |

          if (!$env:GH_PAT) {
            throw "GH_PAT is not configured."
          }

          $repository =
            "${{ github.repository }}"

          $workflow =
            "rdp.yml"

          $ref =
            "main"

          $uri =
            "https://api.github.com/repos/$repository/actions/workflows/$workflow/dispatches"

          $headers = @{
            Authorization =
              "Bearer $env:GH_PAT"

            Accept =
              "application/vnd.github+json"

            "X-GitHub-Api-Version" =
              "2022-11-28"

            "User-Agent" =
              "RDP-Persistence"
          }

          $body = @{
            ref = $ref
          } |
          ConvertTo-Json

          $encoded =
            [System.Text.Encoding]::UTF8.GetBytes($body)

          $client =
            New-Object System.Net.Http.HttpClient

          try {

            foreach ($header in $headers.GetEnumerator()) {

              $client.DefaultRequestHeaders.TryAddWithoutValidation(
                $header.Key,
                $header.Value
              ) | Out-Null
            }

            $content =
              New-Object System.Net.Http.ByteArrayContent($encoded)

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $responseBody =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().
              GetResult()

            Write-Host `
              "GitHub dispatch status: $($response.StatusCode)"

            if ($responseBody) {
              Write-Host $responseBody
            }

            if (!$response.IsSuccessStatusCode) {
              throw `
                "Failed to dispatch next RDP workflow."
            }
          }
          finally {
            $content.Dispose()
            $client.Dispose()
          }

          Write-Host ""
          Write-Host `
            "NEXT RDP SESSION DISPATCHED SUCCESSFULLY." `
            -ForegroundColor Green


      # ============================================================
      # 15. Final Telegram notification
      # ============================================================

      - name: Send transition notification
        if: always()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          $status =
            "${{ job.status }}"

          if ($status -eq "success") {

            $message = @"
            🔄 <b>RDP Session Transitioned</b>

            ✅ Previous state backed up
            ✅ Checkpoint verified
            ✅ Next RDP workflow dispatched

            The next machine will restore the latest READY generation.
            "@
          }
          else {

            $message = @"
            ⚠️ <b>RDP Transition Failed</b>

            Status:
            <code>$status</code>

            The last successfully published checkpoint remains available.
            "@
          }

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            parse_mode = "HTML"
          }

          $json =
            $payload |
            ConvertTo-Json -Depth 10

          $encoded =
            [System.Text.Encoding]::UTF8.GetBytes($json)

          $client =
            New-Object System.Net.Http.HttpClient

          try {

            $content =
              New-Object System.Net.Http.ByteArrayContent($encoded)

            $content.Headers.ContentType =
              New-Object System.Net.Http.Headers.MediaTypeHeaderValue(
                "application/json"
              )

            $content.Headers.ContentType.CharSet = "utf-8"

            $uri =
              "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage"

            $response =
              $client.PostAsync(
                $uri,
                $content
              ).GetAwaiter().GetResult()

            $body =
              $response.Content.ReadAsStringAsync().
              GetAwaiter().
              GetResult()

            Write-Host $body

            if (!$response.IsSuccessStatusCode) {
              Write-Warning `
                "Telegram final notification failed: $body"
            }
          }
          finally {
            $content.Dispose()
            $client.Dispose()
          }